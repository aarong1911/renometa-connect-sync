[build]
  command = "pnpm build"
  publish = "dist"

[dev]
  command = "pnpm dev"
  targetPort = 5173
  port = 9999
  autoLaunch = false

[functions]
  directory = "netlify/functions"

# Phase 14.1 Campaigns — durable batch worker for queued/scheduled campaign
# sends. See netlify/functions/marketing-campaign-process-queue.ts for why
# bulk sending cannot happen synchronously inside a normal request.
[functions."marketing-campaign-process-queue"]
  schedule = "*/5 * * * *"